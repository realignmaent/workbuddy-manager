<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WorkBuddy Manager</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    .logo-container {
      position: relative;
      margin-bottom: 24px;
    }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.4);
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      color: #f1f5f9;
    }
    .status {
      font-size: 13px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(148, 163, 184, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .subtext {
      position: absolute;
      bottom: 20px;
      font-size: 11px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <img class="logo" src="icons/icon.png" alt="WorkBuddy Logo" onerror="this.style.display='none'" />
  </div>
  <h1>WorkBuddy Manager</h1>
  <div class="status">
    <div class="spinner"></div>
    <span id="status-text">正在启动本地网关服务...</span>
  </div>
  <div class="subtext">OpenAI 兼容反代网关 & 账号池管理</div>

  <script>
    // 定时探测本地 7864 端口服务是否已就绪
    async function checkServer() {
      try {
        const res = await fetch("http://127.0.0.1:7864/healthz");
        if (res.ok) {
          document.getElementById("status-text").innerText = "服务就绪，进入面板...";
          setTimeout(() => {
            window.location.href = "http://127.0.0.1:7864";
          }, 400);
          return;
        }
      } catch (e) {
        // 尚未启动完成，继续轮询
      }
      setTimeout(checkServer, 600);
    }
    setTimeout(checkServer, 1000);
  </script>
</body>
</html>
